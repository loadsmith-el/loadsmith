[package]
name    = "loadsmith-postgres"
version = "0.1.0"
edition = "2021"
license.workspace = true

# The postgres plugin family: a single crate that emits both the source and
# destination binaries and shares the connection layer (conn.rs) internally.
# Postgres-specific knowledge lives here, in the plugin layer — never in the core
# crates. Generic TLS comes from `loadsmith-tls`.

[lib]
name = "loadsmith_postgres"
path = "src/lib.rs"

[[bin]]
name = "loadsmith-source-postgres"
path = "src/bin/source.rs"

[[bin]]
name = "loadsmith-destination-postgres"
path = "src/bin/destination.rs"

[dependencies]
tokio                          = { workspace = true }
anyhow                         = { workspace = true }
tracing                        = { workspace = true }
serde                          = { workspace = true }
serde_json                     = { workspace = true }
async-trait                    = { workspace = true }
arrow                          = { workspace = true }
arrow-array                    = { workspace = true }
arrow-schema                   = { workspace = true }
tokio-postgres                 = { workspace = true }
postgres-types                 = { workspace = true, features = ["with-chrono-0_4"] }
chrono                         = { version = "0.4", features = ["serde"] }
bytes                          = "1"
futures-util                   = "0.3"
tokio-postgres-rustls-improved = { version = "0.16", default-features = false }
loadsmith-plugin-sdk           = { path = "../../crates/loadsmith-plugin-sdk" }
loadsmith-arrow                = { path = "../../crates/loadsmith-arrow" }
loadsmith-tls                  = { path = "../../crates/loadsmith-tls" }
