[package]
name    = "loadsmith-destination-parquet"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "loadsmith-destination-parquet"
path = "src/main.rs"

[dependencies]
tokio            = { workspace = true }
anyhow           = { workspace = true }
tracing          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
async-trait      = { workspace = true }
arrow-array      = { workspace = true }
arrow-schema     = { workspace = true }
loadsmith-plugin-sdk = { path = "../../../crates/loadsmith-plugin-sdk" }

# Parquet writer. The `parquet` crate is released in lockstep with `arrow`
# (shared major version), so this must match the workspace's arrow = "54".
parquet  = "54"
# Human-readable size strings ("500KiB", "10MB") for `max_file_size`. Pure Rust,
# no transitive native deps — keeps the multi-arch-first / pure-Rust posture.
bytesize = "1"
