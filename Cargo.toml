[workspace]
members = [
    "crates/loadsmith-protocol",
    "crates/loadsmith-transport",
    "crates/loadsmith-arrow",
    "crates/loadsmith-plugin-sdk",
    "crates/loadsmith-config",
    "crates/loadsmith-plugin-manifest",
    "crates/loadsmith-core",
    "crates/loadsmith-cli",
    "crates/loadsmith-tls",
]
resolver = "2"

# Plugins live in their own repo now (loadsmith-canonical-plugins). This repo is
# the core + the SDK crates (loadsmith-plugin-sdk/arrow/tls/protocol/transport)
# the plugins git-dep. Install plugins with `loadsmith plugin install <name>`.

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
anyhow      = "1"
thiserror   = "1"
tracing     = "0.1"
async-trait = "0.1"
arrow       = "54"
arrow-ipc   = "54"
arrow-schema = "54"
arrow-array  = "54"
clap        = { version = "4", features = ["derive"] }
tokio-util  = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rustix      = { version = "0.38", features = ["fs", "pipe", "process"] }
tokio-postgres = "0.7"
postgres-types = { version = "0.2" }

[profile.release]
strip = true
opt-level = 3
