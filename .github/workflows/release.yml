name: Release

# Tag the engine `vX.Y.Z` (matching crates/loadsmith-cli/Cargo.toml) and push the
# tag — this builds the core NATIVELY for amd64 + arm64 (no QEMU), publishing
# BOTH:
#   - the slim image ghcr.io/loadsmith-el/loadsmith (tags: <tag>-slim, slim, sha-<sha>-slim)
#   - a GitHub Release with per-arch binary archives + sha256
#
# Release vs prerelease is decided by the tag, by semver: a clean `vX.Y.Z` is a
# stable release (moves the rolling `:slim` tag); a `vX.Y.Z-<suffix>` (e.g.
# `v0.1.0-pre`) is a prerelease — it publishes `:<tag>-slim` + `:sha-*-slim` but
# does NOT move `:slim`, and the GitHub Release is marked --prerelease.

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/loadsmith-el/loadsmith

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      image_tag: ${{ steps.m.outputs.image_tag }}
      sha_short: ${{ steps.m.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          tag="${GITHUB_REF_NAME}"          # vX.Y.Z or vX.Y.Z-<pre>
          version="${tag#v}"                # X.Y.Z / X.Y.Z-<pre>
          base="${version%%-*}"             # X.Y.Z (semver base, no prerelease)
          crate=$(grep -m1 '^version' crates/loadsmith-cli/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$base" != "$crate" ]; then
            echo "::error::tag base '$base' != crates/loadsmith-cli version '$crate'"; exit 1
          fi
          case "$version" in *-*) pre=true;; *) pre=false;; esac
          {
            echo "version=$version"
            echo "prerelease=$pre"
            echo "image_tag=${tag}-slim"     # e.g. v0.1.0-slim / v0.1.0-pre-slim
            echo "sha_short=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build (native ${{ matrix.arch }})
        run: cargo build --release --bin loadsmith

      - name: Package release tarball
        run: |
          tarball="loadsmith-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$tarball" -C target/release loadsmith
          sha256sum "$tarball" > "${tarball}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            loadsmith-*.tar.gz
            loadsmith-*.tar.gz.sha256
          retention-days: 1

      - name: Assemble image build context
        run: |
          mkdir -p ctx
          cp target/release/loadsmith ctx/loadsmith
          cp ci/runtime.Dockerfile ctx/Dockerfile

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image by digest (${{ matrix.arch }})
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"   # artifact filenames can't contain ':'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release
      packages: write          # push the multi-arch manifest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          tags=( -t "${IMAGE}:${{ needs.meta.outputs.image_tag }}" \
                 -t "${IMAGE}:sha-${{ needs.meta.outputs.sha_short }}-slim" )
          if [ "${{ needs.meta.outputs.prerelease }}" = "false" ]; then
            tags+=( -t "${IMAGE}:slim" )   # rolling tag only for stable releases
          fi
          refs=()
          for d in /tmp/digests/*; do refs+=( "${IMAGE}@sha256:$(basename "$d")" ); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.meta.outputs.image_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          [ "${{ needs.meta.outputs.prerelease }}" = "true" ] && flags+=( --prerelease )
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "loadsmith ${GITHUB_REF_NAME}" \
            --notes "Slim core image: \`docker pull ${IMAGE}:${{ needs.meta.outputs.image_tag }}\` (stable also \`${IMAGE}:slim\`). Linux amd64+arm64 binaries attached; plugins install on demand with \`loadsmith plugin install --all\`." \
            dist/*.tar.gz dist/*.sha256
