name: Release

# Tag the engine `vX.Y.Z` (matching crates/loadsmith-cli/Cargo.toml) and push the
# tag — this builds the core NATIVELY for amd64 + arm64 (no QEMU) as a static
# musl binary, publishing BOTH:
#   - the image ghcr.io/loadsmith-el/loadsmith in four flavors, all multi-arch
#     and all from that one binary (see ci/runtime.Dockerfile):
#       static, static-debug, slim, bundled
#     each tagged <tag>-<flavor>, sha-<sha>-<flavor> and the rolling <flavor>;
#     `latest` = slim;
#   - a GitHub Release with per-arch binary archives + sha256.
#
# `bundled` carries every canonical plugin at the version the index lists as
# latest when the release runs (resolved once, in `meta`, so both arches get the
# same set); the list is in the image label `dev.loadsmith.plugins`. A plugin
# release does not rebuild it — the next engine release picks it up.
#
# Release vs prerelease is decided by the tag, by semver: a clean `vX.Y.Z` is a
# stable release (moves the rolling tags and `latest`); a `vX.Y.Z-<suffix>` (e.g.
# `v0.1.0-pre`) is a prerelease — it publishes `:<tag>-<flavor>` +
# `:sha-*-<flavor>` but moves no rolling tag, and the GitHub Release is marked
# --prerelease.

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/loadsmith-el/loadsmith
  FLAVORS: static static-debug slim bundled
  PLUGIN_INDEX: https://raw.githubusercontent.com/loadsmith-el/loadsmith-canonical-plugins/main/index.json
  # Same Rust version as rust-toolchain.toml (and the Dockerfile). Bump together.
  RUST_IMAGE: rust:1.99.0-alpine

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      sha_short: ${{ steps.m.outputs.sha_short }}
      plugins: ${{ steps.p.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          tag="${GITHUB_REF_NAME}"          # vX.Y.Z or vX.Y.Z-<pre>
          version="${tag#v}"                # X.Y.Z / X.Y.Z-<pre>
          base="${version%%-*}"             # X.Y.Z (semver base, no prerelease)
          crate=$(grep -m1 '^version' crates/loadsmith-cli/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$base" != "$crate" ]; then
            echo "::error::tag base '$base' != crates/loadsmith-cli version '$crate'"; exit 1
          fi
          case "$version" in *-*) pre=true;; *) pre=false;; esac
          {
            echo "version=$version"
            echo "prerelease=$pre"
            echo "sha_short=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - id: p
        name: Snapshot the canonical plugin set for the bundled image
        run: |
          # "name@version" pairs, space-separated, sorted.
          plugins=$(curl -fsSL "$PLUGIN_INDEX" | python3 -c 'import json, sys
          idx = json.load(sys.stdin)["plugins"]
          print(" ".join(n + "@" + p["latest"] for n, p in sorted(idx.items())))')
          echo "plugins=$plugins"
          test -n "$plugins"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Compile inside the pinned rust image (RUST_IMAGE; host target
      # *-unknown-linux-musl): the binary is fully static, so it runs on every
      # image flavor, on any Linux host, and in the lab's `--loadsmith <binary>`
      # wrap — no glibc floor. Native arch per runner — no QEMU.
      # The workspace tests run first, in the same image on the same arch as
      # the binary we ship: nothing is published from a tree that fails them.
      - name: Test (musl, native ${{ matrix.arch }})
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e CARGO_HOME=/tmp/cargo \
            -v "$PWD":/src -w /src "$RUST_IMAGE" \
            cargo test --workspace --locked
      - name: Build core (static musl, native ${{ matrix.arch }})
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e CARGO_HOME=/tmp/cargo \
            -v "$PWD":/src -w /src "$RUST_IMAGE" \
            cargo build --release --locked --bin loadsmith
      - name: Check the binary is fully static
        run: |
          file target/release/loadsmith
          if readelf -d target/release/loadsmith | grep -q NEEDED; then
            echo "::error::loadsmith is dynamically linked"; exit 1
          fi

      - name: Package release tarball
        run: |
          tarball="loadsmith-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$tarball" -C target/release loadsmith
          sha256sum "$tarball" > "${tarball}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: |
            loadsmith-*.tar.gz
            loadsmith-*.tar.gz.sha256
          retention-days: 1

      - name: Assemble image build context
        run: |
          mkdir -p ctx/plugins
          cp target/release/loadsmith ctx/loadsmith
          cp ci/runtime.Dockerfile ctx/Dockerfile
          # The bundled flavor's plugins, installed by the binary just built
          # (it runs natively here), pinned to the set resolved in `meta`.
          for p in ${{ needs.meta.outputs.plugins }}; do
            ./target/release/loadsmith plugin install "$p" --plugin-dir ctx/plugins
          done
          ls -la ctx/plugins

      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push each flavor by digest (${{ matrix.arch }})
        run: |
          for f in $FLAVORS; do
            docker buildx build ctx \
              --platform "linux/${{ matrix.arch }}" \
              --target "$f" \
              --build-arg "PLUGINS=${{ needs.meta.outputs.plugins }}" \
              --label "org.opencontainers.image.version=${{ needs.meta.outputs.version }}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "meta-$f.json"
            digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "meta-$f.json")
            echo "$f: $digest"
            mkdir -p "/tmp/digests/$f"
            touch "/tmp/digests/$f/${digest#sha256:}"   # artifact filenames can't contain ':'
          done
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/
          retention-days: 1

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release
      packages: write          # push the multi-arch manifests
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifests
        run: |
          for f in $FLAVORS; do
            tags=( -t "${IMAGE}:${GITHUB_REF_NAME}-$f" \
                   -t "${IMAGE}:sha-${{ needs.meta.outputs.sha_short }}-$f" )
            if [ "${{ needs.meta.outputs.prerelease }}" = "false" ]; then
              tags+=( -t "${IMAGE}:$f" )                      # rolling, stable only
              [ "$f" = slim ] && tags+=( -t "${IMAGE}:latest" )
            fi
            refs=()
            for d in "/tmp/digests/$f"/*; do refs+=( "${IMAGE}@sha256:$(basename "$d")" ); done
            [ "${#refs[@]}" -eq 2 ] || { echo "::error::$f: expected 2 arch digests, got ${#refs[@]}"; exit 1; }
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
            docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}-$f"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=$(cat <<EOF
          Images (linux amd64+arm64), all from one static binary:

          | flavor | pull | |
          |---|---|---|
          | static | \`${IMAGE}:${tag}-static\` | distroless/static, ~13MB (~4MB download) |
          | static-debug | \`${IMAGE}:${tag}-static-debug\` | + busybox shell |
          | slim | \`${IMAGE}:${tag}-slim\` | debian:bookworm-slim |
          | bundled | \`${IMAGE}:${tag}-bundled\` | slim + canonical plugins |

          Stable releases also move the rolling \`:<flavor>\` tags and \`:latest\` (= slim).
          Bundled plugins: ${{ needs.meta.outputs.plugins }}

          The attached binaries are static (musl) and run on any Linux. Other flavors install plugins on demand: \`loadsmith plugin install --all\`.
          EOF
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run: refresh the assets in place rather than failing on "exists".
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz dist/*.sha256
          else
            flags=()
            [ "${{ needs.meta.outputs.prerelease }}" = "true" ] && flags+=( --prerelease )
            gh release create "$tag" "${flags[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "loadsmith $tag" \
              --notes "$notes" \
              dist/*.tar.gz dist/*.sha256
          fi
