[package]
name    = "loadsmith-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "loadsmith"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde_yaml         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
loadsmith-core     = { path = "../loadsmith-core" }
loadsmith-config   = { path = "../loadsmith-config" }
loadsmith-plugin-manifest = { path = "../loadsmith-plugin-manifest" }
loadsmith-tls      = { path = "../loadsmith-tls" }
# Plugin download: pure-Rust TLS (multi-arch rule — no ring/aws-lc/native-tls),
# pure-Rust gzip (flate2/miniz_oxide) + tar, sha2 for artifact verification.
rustls             = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots       = "0.26"
sha2               = "0.10"
flate2             = "1"
tar                = "0.4"
