[package]
name    = "loadsmith-cli"
version = "1.4.1"
edition = "2021"
license.workspace = true
# The engine binary ships as release archives and images, not via crates.io.
publish = false

[[bin]]
name = "loadsmith"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde_yaml         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
loadsmith-core     = { path = "../loadsmith-core", default-features = false }
loadsmith-config   = { path = "../loadsmith-config" }
loadsmith-plugin-manifest = { path = "../loadsmith-plugin-manifest" }
loadsmith-tls      = { path = "../loadsmith-tls" }
# Plugin download: pure-Rust TLS (multi-arch rule — no ring/aws-lc/native-tls),
# pure-Rust gzip (flate2/miniz_oxide) + tar, sha2 for artifact verification.
rustls             = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots       = "0.26"
sha2               = "0.10"
flate2             = "1"
tar                = "0.4"
# Global allocator (static musl release builds; see main.rs).
mimalloc           = { version = "0.1", default-features = false }

[features]
default = ["grpc"]
# The OTLP/gRPC telemetry exporter (see loadsmith-core).
grpc = ["loadsmith-core/grpc"]

[dev-dependencies]
# The fake plugins the exit-code tests run against (shared with the core's
# end-to-end tests).
arrow-array          = { workspace = true }
arrow-schema         = { workspace = true }
async-trait          = { workspace = true }
loadsmith-arrow      = { path = "../loadsmith-arrow" }
loadsmith-plugin-sdk = { path = "../loadsmith-plugin-sdk" }
loadsmith-protocol   = { path = "../loadsmith-protocol" }

# The test binary doubles as the fake plugins, so it needs its own `main`.
[[test]]
name    = "exit_codes"
harness = false
