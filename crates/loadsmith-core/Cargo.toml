[package]
name    = "loadsmith-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
# Engine internals: no stable Rust API, never published (see docs/src/reference/stability.md).
publish = false

[dependencies]
tokio              = { workspace = true }
tokio-util         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
rustix             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
libc               = "0.2"
serde_yaml         = { workspace = true }
loadsmith-protocol  = { path = "../loadsmith-protocol" }
loadsmith-transport = { path = "../loadsmith-transport" }
loadsmith-config    = { path = "../loadsmith-config" }
loadsmith-arrow     = { path = "../loadsmith-arrow" }
arrow-schema        = { workspace = true }
loadsmith-tls       = { path = "../loadsmith-tls" }
loadsmith-aws       = { path = "../loadsmith-aws" }

# OpenTelemetry: the core is the only exporter (OTLP over http/protobuf and
# gRPC). No default features anywhere: no internal-logs (exporter errors are
# reported once by the core), and TLS through rustls with the pure-Rust
# crypto provider (multi-arch rule: no ring / aws-lc).
opentelemetry         = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk     = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp    = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-http    = { version = "0.33.1", default-features = false, features = ["reqwest-blocking"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
reqwest               = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
tonic                 = { version = "0.14", default-features = false, features = ["tls-webpki-roots"], optional = true }
rustls                = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots          = "0.26"
async-trait           = { workspace = true }
http                  = "1"

[features]
default = ["grpc"]
# The OTLP/gRPC exporter (tonic). Off: telemetry speaks http/protobuf only,
# and a smaller binary.
grpc = ["dep:tonic", "opentelemetry-otlp/grpc-tonic", "opentelemetry-otlp/tls-provider-agnostic"]

[dev-dependencies]
arrow-array          = { workspace = true }
async-trait          = { workspace = true }
loadsmith-plugin-sdk = { path = "../loadsmith-plugin-sdk" }
opentelemetry_sdk    = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "testing"] }
httpmock             = "0.7"
opentelemetry        = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
tracing-subscriber   = { workspace = true }

# End-to-end abort tests: the test binary doubles as the fake plugins, so it
# needs its own `main` (see tests/abort.rs).
[[test]]
name    = "abort"
harness = false

# End-to-end provider resolution tests (same fake-plugin trick).
[[test]]
name    = "providers"
harness = false

# End-to-end parser-stage tests: raw source → parser → destination.
[[test]]
name    = "parser"
harness = false

# End-to-end unknown-keys policy tests (pipeline file and plugin configs).
[[test]]
name    = "unknown_keys"
harness = false

# End-to-end telemetry tests: fake plugins on the current SDK, in-memory
# exporters.
[[test]]
name    = "telemetry"
harness = false
