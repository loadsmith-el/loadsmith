[package]
name    = "loadsmith-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
# Engine internals: no stable Rust API, never published (see docs/src/reference/stability.md).
publish = false

[dependencies]
tokio              = { workspace = true }
tokio-util         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
rustix             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
libc               = "0.2"
serde_yaml         = { workspace = true }
loadsmith-protocol  = { path = "../loadsmith-protocol" }
loadsmith-transport = { path = "../loadsmith-transport" }
loadsmith-config    = { path = "../loadsmith-config" }
loadsmith-arrow     = { path = "../loadsmith-arrow" }
arrow-schema        = { workspace = true }

[dev-dependencies]
arrow-array          = { workspace = true }
async-trait          = { workspace = true }
loadsmith-plugin-sdk = { path = "../loadsmith-plugin-sdk" }

# End-to-end abort tests: the test binary doubles as the fake plugins, so it
# needs its own `main` (see tests/abort.rs).
[[test]]
name    = "abort"
harness = false

# End-to-end provider resolution tests (same fake-plugin trick).
[[test]]
name    = "providers"
harness = false
