[package]
name    = "loadsmith-plugin-sdk"
version = "0.1.0"
edition = "2021"
license.workspace = true
# 0.x, consumed by git revision; not published (see docs/src/reference/stability.md).
publish = false

[dependencies]
tokio              = { workspace = true }
async-trait        = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
# The telemetry layer (spans + log events → fd4). Registry only: no fmt,
# no env-filter.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
serde_json         = { workspace = true }
serde              = { workspace = true }
# The published config schema (config_schema.rs).
schemars           = "1"
loadsmith-protocol = { path = "../loadsmith-protocol" }
loadsmith-transport = { path = "../loadsmith-transport" }
loadsmith-arrow    = { path = "../loadsmith-arrow" }
arrow-array        = { workspace = true }
arrow-schema       = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
